<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مصروفي">
  <meta name="format-detection" content="telephone=no">
  <title>مصروفي</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <h1 id="title">مصروفي</h1>
    <button class="iconbtn" data-act="go" data-v="settings" aria-label="الإعدادات">⚙️</button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-act="go" data-v="add" class="on"><span>➕</span>سجّل</button>
    <button data-act="go" data-v="day"><span>📅</span>اليوم</button>
    <button data-act="go" data-v="month"><span>📊</span>الشهر</button>
    <button data-act="go" data-v="money"><span>💰</span>فلوسي</button>
    <button data-act="go" data-v="ask"><span>💬</span>اسأل</button>
  </nav>
  <div id="sheet"></div>
  <div id="toast"></div>
  <div id="overlay"></div>
  <noscript>التطبيق بحاجة JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
